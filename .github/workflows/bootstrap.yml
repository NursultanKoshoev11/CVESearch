name: Restore CVE Atlas repository

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap.yml
      - .cve-atlas-bootstrap/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cve-atlas-bootstrap-main
  cancel-in-progress: false

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and verify project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .cve-atlas-bootstrap/part-00
          cat .cve-atlas-bootstrap/part-* > /tmp/cve-atlas.tar.gz.b64
          base64 --decode /tmp/cve-atlas.tar.gz.b64 > /tmp/cve-atlas.tar.gz
          echo 'e416c729db8905dc6d0e21db53a710841fec8e1f8ad1e87bbeda120b48856143  /tmp/cve-atlas.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/cve-atlas.tar.gz -C .
          rm -rf .bootstrap .cve-atlas-bootstrap
          rm -f .github/workflows/bootstrap.yml
          test -f AGENTS.md
          test -f README.md
          test -f docs/specification/CVE-Atlas.md
          test -f apps/api/main.go
          test -f apps/web/package.json
          test -f migrations/001_init.sql
          test -f openapi/openapi.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Validate formatting and core tests
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l apps internal packages)"
          go test ./internal/risk ./internal/scopeguard ./packages/sourceclient

      - name: Publish project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement CVE Atlas foundation and core domain'
          git push origin HEAD:main
